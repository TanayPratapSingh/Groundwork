# A template. Do not commit a filled-in copy of this file.
#
# Kubernetes Secrets are base64, which is an encoding and not encryption.
# Anyone with read access to the namespace, and anyone who can read etcd, can
# recover the plaintext. This manifest is the minimum bar, not the goal.
#
# For production use one of:
#   - External Secrets Operator, sourcing from a real secrets manager
#   - Sealed Secrets, so the committed artefact is encrypted
#   - The cloud provider's CSI secrets driver, mounting at runtime
#
# Whichever you pick, the properties to insist on are rotation, per-key
# revocation, and an access log. `GROUNDWORK_API_KEYS` in an environment
# variable has none of the three.
#
# Generate keys with real entropy:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"

apiVersion: v1
kind: Secret
metadata:
  name: groundwork-secrets
type: Opaque
stringData:
  # Leave empty to run on the deterministic offline provider.
  ANTHROPIC_API_KEY: ""

  # Format: "<key>:<tenant>,<key>:<tenant>"
  # Keys prefixed `dev-key-` are refused unless GROUNDWORK_ALLOW_DEV_KEYS=1,
  # so a copied template fails closed rather than granting access.
  GROUNDWORK_API_KEYS: ""
