name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install -r requirements.txt

      # The datasets are external, so a fetch failure is an infrastructure
      # problem and not a code problem. Tests that need data skip cleanly
      # when it is absent; the gate step below is what hard-fails.
      - name: Fetch real datasets
        run: python3 scripts/fetch_data.py
        continue-on-error: true

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Build index
        run: python3 scripts/build_index.py

      # Exits non-zero when a metric falls below its floor or regresses
      # against artifacts/baseline.json. This is the step that fails a pull
      # request for making the system worse rather than for breaking it.
      - name: Evaluation and release gate
        run: python3 scripts/run_eval.py -n 600

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: artifacts/
